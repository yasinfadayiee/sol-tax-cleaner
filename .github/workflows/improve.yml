name: Daily improvement

# Three times a day Claude does the next item of docs/ROADMAP.md (a new guide, FAQ, copy or link polish), then this
# workflow checks the change itself before it goes live:
#   - only allowed paths changed (no workflows, payments, config or dependencies),
#   - lint, tests and the full build pass.
# If all is well it commits to main, starts a deploy and sends the owner a Persian summary on Telegram;
# otherwise nothing is published and the owner is told.
#
# Uses the owner's Claude plan through CLAUDE_CODE_OAUTH_TOKEN (no API bill). To stay inside Pro limits each run
# is one small item on Sonnet with a turn cap, and runs sit in separate 5-hour usage windows, two of them at night
# in Iran (UTC+3:30). The weekly Opus planner (plan.yml) decides what goes into the roadmap.
on:
  schedule:
    - cron: '0 20 * * *'
    - cron: '0 1 * * *'
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: improve
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  issues: read
  pull-requests: read
  id-token: write

jobs:
  improve:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.SOLTAXBOT }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHATID }}
      SUMMARY: /tmp/stc-summary.txt
    steps:
      - id: token
        run: echo "set=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.token.outputs.set == 'true'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: steps.token.outputs.set == 'true'
        with:
          node-version: 22
          cache: npm
      - if: steps.token.outputs.set == 'true'
        run: npm ci

      - uses: anthropics/claude-code-action@v1
        if: steps.token.outputs.set == 'true'
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: >-
            --model sonnet --max-turns 30
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(npm run lint),Bash(npm test),Bash(npm run build),Bash(git status),Bash(git diff:*),Bash(ls:*)"
          prompt: |
            You improve the SolTax Cleaner website (repository ${{ github.repository }}, working directory is its
            checkout). Read docs/ROADMAP.md and follow its rules exactly: do the first unchecked Backlog item only,
            tick it with today's date, then run `npm run lint`, `npm test` and `npm run build` and fix anything you
            broke. Do not commit, push or open pull requests; the workflow does that after its own checks.
            Finally write a one-line summary in simple Persian for the owner to /tmp/stc-summary.txt.

      - name: Check and publish
        id: publish
        if: steps.token.outputs.set == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -A
          changed=$(git diff --cached --name-only)
          if [ -z "$changed" ]; then echo "result=nothing" >> "$GITHUB_OUTPUT"; exit 0; fi
          echo "$changed"
          if echo "$changed" | grep -qE '^(\.github/|src/license/|src/config\.ts$|package(-lock)?\.json$|scripts/monitor\.mjs$|scripts/indexnow\.mjs$)'; then
            echo "result=forbidden" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! (npm run lint && npm test && npm run build); then echo "result=failed" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          item=$(git diff --cached docs/ROADMAP.md | grep -m1 '^+- \[x\]' | cut -c8- | cut -c1-120)
          git commit -m "Daily improvement: ${item:-roadmap item}"
          git pull --rebase origin main
          git push origin HEAD:main
          # Pushes made with the workflow token don't start other workflows, so start the deploy explicitly.
          gh workflow run deploy.yml --ref main
          echo "result=published" >> "$GITHUB_OUTPUT"

      - name: Tell the owner on Telegram
        if: always()
        env:
          RESULT: ${{ steps.publish.outputs.result }}
          TOKEN_SET: ${{ steps.token.outputs.set }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          summary=$(head -c 600 "$SUMMARY" 2>/dev/null || true)
          case "$RESULT" in
            published) text="🛠 بهبود امروز سایت منتشر شد:
          ${summary}" ;;
            nothing) text="ℹ️ بهبود امروز: تغییری لازم نبود." ;;
            forbidden) text="⛔️ تغییر امروز به بخش‌های حساس دست زده بود و منتشر نشد. $RUN_URL" ;;
            failed) text="⚠️ تغییر امروز تست‌ها را رد کرد و منتشر نشد. $RUN_URL" ;;
            *) if [ "$TOKEN_SET" != "true" ]; then exit 0; fi
               text="⚠️ بهبود خودکار امروز اجرا نشد (شاید سهمیه‌ی Claude تمام شده بود). فردا دوباره امتحان می‌کند. $RUN_URL" ;;
          esac
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
