name: Daily maintenance

# Free upkeep with no AI and no Claude usage, every day before the improvement runs:
#   - renders a social preview image for every guide that doesn't have one yet (Playwright),
#   - runs the SEO check (scripts/seo-check.mjs) and puts any problem it finds at the top of docs/ROADMAP.md,
#     so the next Claude run fixes a real problem instead of searching for one.
# Commits to main, starts a deploy when the site changed, and tells the owner on Telegram only when it did something.
on:
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

concurrency:
  group: improve
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Render missing guide images
        run: |
          missing=$(node scripts/seo-check.mjs --missing-og)
          [ -z "$missing" ] && { echo "All guides have an image."; exit 0; }
          echo "$missing"
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          ONLY_MISSING=1 node scripts/brand/render.mjs

      - name: SEO check
        run: |
          npm run build > /dev/null
          node scripts/seo-check.mjs --roadmap

      - name: Publish
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add public/og docs/ROADMAP.md
          changed=$(git diff --cached --name-only)
          [ -z "$changed" ] && exit 0
          images=$(echo "$changed" | grep -c '^public/og/' || true)
          items=$(git diff --cached docs/ROADMAP.md | grep -c '^+- \[ \] Fix (auto-check)' || true)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Daily maintenance: ${images} guide image(s), ${items} SEO fix item(s)"
          git pull --rebase origin main
          git push origin HEAD:main
          if [ "$images" -gt 0 ]; then gh workflow run deploy.yml --ref main; fi
          echo "images=$images" >> "$GITHUB_OUTPUT"
          echo "items=$items" >> "$GITHUB_OUTPUT"

      - name: Tell the owner on Telegram
        if: steps.publish.outputs.images != '' || failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.SOLTAXBOT }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.CHATID }}
          IMAGES: ${{ steps.publish.outputs.images }}
          ITEMS: ${{ steps.publish.outputs.items }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ] || exit 0
          if [ -n "$IMAGES" ]; then
            text="🧹 نگهداری رایگان امروز (بدون Claude): ${IMAGES} تصویر برای راهنماهای تازه ساخته شد، ${ITEMS} مشکل سئو پیدا و به فهرست کارها اضافه شد."
          else
            text="⚠️ نگهداری روزانه خطا داد: $RUN_URL"
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "disable_web_page_preview=true" > /dev/null
